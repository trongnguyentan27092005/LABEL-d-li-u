<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ViRPM Pilot Annotation</title>
<style>
:root{--ink:#172033;--muted:#64748b;--line:#dbe3ef;--bg:#f5f7fb;--blue:#2563eb;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{padding:17px 5vw;background:#111827;color:white;display:flex;justify-content:space-between}header h1{margin:0;font-size:18px}main{max-width:1400px;margin:22px auto;padding:0 18px}.card{padding:18px;background:white;border:1px solid var(--line);border-radius:14px;margin-bottom:15px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.title{font-size:16px;font-weight:750;margin:0 0 10px}.text{white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:8px;max-height:190px;overflow:auto}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}.gallery img{width:100%;height:112px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#f8fafc}.review{display:block;max-width:100%;max-height:400px;object-fit:contain;margin:auto;border-radius:8px;background:#f8fafc}label{font-weight:650;display:block;margin:10px 0 6px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #bcc8d8;border-radius:8px}textarea{min-height:72px}.options{display:flex;gap:8px;flex-wrap:wrap}.opt{display:block;border:1px solid #bcc8d8;border-radius:8px;padding:9px;cursor:pointer}.opt input{width:auto}.opt:has(input:checked){background:#eff6ff;border-color:var(--blue)}button{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:white;font-weight:700;cursor:pointer}button.secondary{background:#e9eef6;color:#25324a}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px}.meta{color:var(--muted);font-size:13px}.error{color:var(--red);font-weight:650}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>ViRPM · Pilot gán nhãn</h1><span id="who">Chưa đăng nhập</span></header><main>
<section id="login" class="card"><h2 class="title">Bắt đầu gán nhãn độc lập</h2><p>Nhập tên/mã của bạn. Nhãn gốc và nhãn của người khác không được hiển thị. Tiến độ lưu trên chính trình duyệt này; khi xong, tải JSON và gửi lại người quản lý.</p><label>Tên / mã người gán<input id="name" placeholder="Ví dụ: annotator_01"></label><label>Tập pilot<select id="dataset"><option value="t2t">T2T · 100 review</option><option value="i2i">I2I · 100 ảnh review</option></select></label><button onclick="start()">Vào gán nhãn</button></section>
<section id="work" class="hidden"><div class="card"><b id="progress"></b> <span id="meta" class="meta"></span><div class="actions"><button class="secondary" onclick="exportData()">Xuất JSON</button><button class="secondary" onclick="location.reload()">Đổi phiên</button></div></div><div id="done" class="card hidden"><h2 class="title">Đã hoàn tất</h2><p>Hãy bấm <b>Xuất JSON</b> và gửi file cho người quản lý.</p></div><form id="form" class="hidden" onsubmit="save(event)"><div id="context" class="grid"></div><div class="grid"><section class="card"><h2 class="title" id="labelTitle"></h2><div id="labels"></div></section><section class="card"><label><input id="ambiguous" type="checkbox" style="width:auto"> Ambiguous</label><p id="err" class="error"></p><div class="actions"><button type="button" class="secondary" onclick="next()">Bỏ qua tạm</button><button>Lưu &amp; tiếp</button></div></section></div></form></section></main>
<script>
const groups={t2t:{R1:'Thuộc tính/chất lượng',R2:'Trải nghiệm mua hàng',R3:'Không khớp mô tả',R4:'Khuyến nghị',N1:'Không có nội dung',N2:'Thư rác/quảng cáo',N3:'Lạc đề',N4:'Chỉ để nhận thưởng',N5:'Không khớp sản phẩm',N6:'Khác'},i2i:{M1:'Không thể nhận diện (UND)',M2:'Thư rác/quảng cáo',M3:'Lạc đề',M4:'Chỉ để nhận thưởng',M5:'Không khớp sản phẩm',M6:'Khác'}};let name='',mode='',items=[],pos=0;
const e=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); const key=()=>`virpm-pilot:${mode}:${name}`; const records=()=>JSON.parse(localStorage.getItem(key())||'{}');
async function start(){name=document.querySelector('#name').value.trim();mode=document.querySelector('#dataset').value;if(!name)return alert('Hãy nhập tên/mã người gán.');items=await fetch(`data/pilot_${mode}.json`).then(r=>r.json());document.querySelector('#login').classList.add('hidden');document.querySelector('#work').classList.remove('hidden');document.querySelector('#who').textContent='Người gán: '+name;next()}
function next(){const done=records();pos=items.findIndex(x=>!done[x.item_id]);render()}
function render(){const done=records(),count=Object.keys(done).length;document.querySelector('#progress').textContent=`Tiến độ: ${count}/${items.length}`;const f=document.querySelector('#form'),finish=document.querySelector('#done');if(pos<0){f.classList.add('hidden');finish.classList.remove('hidden');return}finish.classList.add('hidden');f.classList.remove('hidden');f.reset();document.querySelector('#err').textContent='';const x=items[pos];document.querySelector('#meta').textContent=` · ${x.review_id}${mode==='i2i'?' · ảnh '+(x.image_index+1):''}`;let left=`<section class="card"><h2 class="title">Sản phẩm</h2><div class="text">${e(x.product_name)}</div><label>Mô tả</label><div class="text">${e(x.product_description)}</div>`;if(mode==='i2i')left+=`<label>Tập ảnh sản phẩm</label><div class="gallery">${x.product_images.map(u=>`<img src="${e(u)}">`).join('')}</div>`;left+='</section>';let right=`<section class="card"><h2 class="title">Review</h2><label>Văn bản</label><div class="text">${e(x.comment)}</div>`;if(mode==='i2i')right+=`<label>Ảnh review cần gán</label><img class="review" src="${e(x.review_image)}">`;right+='</section>';document.querySelector('#context').innerHTML=left+right;document.querySelector('#labelTitle').textContent=mode==='t2t'?'T2T · Liên quan văn bản':'I2I · Tương ứng ảnh';document.querySelector('#labels').innerHTML=mode==='t2t'?`<label>Nhãn chính</label><div class="options"><label class="opt"><input type="radio" name="label" value="1" required> Relevant (1)</label><label class="opt"><input type="radio" name="label" value="0"> Irrelevant (0)</label></div><label>Nhóm chẩn đoán</label><select id="group" required><option value="">Chọn nhóm…</option>${Object.entries(groups.t2t).map(([k,v])=>`<option value="${k}">${k} — ${v}</option>`).join('')}</select>`:`<label>Nhãn chính</label><div class="options"><label class="opt"><input type="radio" name="label" value="1" required> Match (1)</label><label class="opt"><input type="radio" name="label" value="0"> Mismatch (0)</label><label class="opt"><input type="radio" name="label" value="UND"> UND</label></div><label>Nhóm chẩn đoán</label><select id="group"><option value="">Match / không áp dụng</option>${Object.entries(groups.i2i).map(([k,v])=>`<option value="${k}">${k} — ${v}</option>`).join('')}</select>`}
function save(ev){ev.preventDefault();const label=document.querySelector('input[name=label]:checked').value,group=document.querySelector('#group').value,ambiguous=document.querySelector('#ambiguous').checked;const x=items[pos],all=records();all[x.item_id]={item_id:x.item_id,subset:x.subset,review_id:x.review_id,image_index:x.image_index??null,product_id:x.product_id,annotator:name,[mode+'_label']:label,[mode+'_diagnostic_group']:group,ambiguous,saved_at:new Date().toISOString()};localStorage.setItem(key(),JSON.stringify(all));next()}
function exportData(){const a=Object.values(records()),blob=new Blob([JSON.stringify(a,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download=`virpm_${mode}_${name}.json`;x.click();URL.revokeObjectURL(u)}
</script></body></html>
